[package]
name = "job"
description = "Async / distributed job runner"
repository = "https://github.com/GaloyMoney/job"
documentation = "https://docs.rs/job"
version = "0.19.5"
license = "Apache-2.0"
edition = "2024"
categories = ["database"]
# Explicit include set: `cargo package`'s default file selection drops
# dot-directories (`.sqlx`) whenever the source tree has no VCS metadata —
# which is exactly the shape nix's fetchgit produces when a consumer pins
# this crate as a git dependency (crane vendors git deps via
# `cargo package -l` on the fetchgit checkout). Without the offline query
# cache every `query!` macro fails to expand for that consumer. Listing the
# packaging set explicitly keeps `.sqlx` (and the embedded `migrations/`)
# present with or without `.git`.
include = [
  "src/**",
  "migrations/**",
  ".sqlx/**",
  "Cargo.toml",
  "README.md",
  "LICENSE",
  "CHANGELOG.md",
  "PERFORMANCE.md",
  "SECURITY.md",
]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(tokio_unstable)'] }

[package.metadata.docs.rs]
all-features = true

[features]

fail-on-warnings = []
es-entity = []
json-schema = ["dep:schemars", "es-entity/json-schema"]
tokio-task-names = ["tokio/tracing"]

[dependencies]
es-entity = { workspace = true, features = ["tracing-context", "errlanes-tracing"] }

async-trait = { workspace = true }
bon = { workspace = true }
tracing = { workspace = true }
chrono = { workspace = true }
futures = { workspace = true }
sqlx = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_with = { workspace = true }
tokio = { workspace = true }
uuid = { workspace = true }
rand = { workspace = true }

schemars = { workspace = true, optional = true }

[dev-dependencies]
anyhow = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["registry"] }

[workspace.dependencies]

es-entity = "0.21.0"

anyhow = "1.0"
async-trait = "0.1"
chrono = { version = "0.4", features = ["clock", "serde"], default-features = false }
bon = "3"
tracing = { version = "0.1" }
sqlx = { version = "0.9", features = ["macros", "runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "json" ] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_with = "3.19"
tokio = { version = "1.52", features = ["rt-multi-thread", "macros"] }
uuid = { version = "1.23", features = ["serde", "v7"] }
futures = "0.3"
rand = "0.10"
schemars = { version = "1.0", features = ["derive", "chrono04", "rust_decimal1"] }
