[package]
name = "job"
description = "Async / distributed job runner"
repository = "https://github.com/GaloyMoney/job"
documentation = "https://docs.rs/job"
version = "0.16.2-dev"
license = "Apache-2.0"
edition = "2024"
categories = ["database"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(tokio_unstable)'] }

[package.metadata.docs.rs]
all-features = true

[features]

fail-on-warnings = []
es-entity = []
json-schema = ["dep:schemars", "es-entity/json-schema"]
tokio-task-names = ["tokio/tracing"]

[dependencies]
es-entity = { workspace = true, features = ["tracing-context", "errlanes-tracing"] }

async-trait = { workspace = true }
derive_builder = { workspace = true }
tracing = { workspace = true }
chrono = { workspace = true }
futures = { workspace = true }
sqlx = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_with = { workspace = true }
tokio = { workspace = true }
uuid = { workspace = true }
rand = { workspace = true }

schemars = { workspace = true, optional = true }

[dev-dependencies]
anyhow = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["registry"] }

[workspace.dependencies]

es-entity = "=0.14.4-dev"

anyhow = "1.0"
async-trait = "0.1"
chrono = { version = "0.4", features = ["clock", "serde"], default-features = false }
derive_builder = "0.20"
tracing = { version = "0.1" }
sqlx = { version = "0.8", features = ["macros", "runtime-tokio-rustls", "postgres", "uuid", "chrono", "json" ] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_with = "3.19"
thiserror = "2.0"
tokio = { version = "1.52", features = ["rt-multi-thread", "macros"] }
uuid = { version = "1.23", features = ["serde", "v7"] }
futures = "0.3"
rand = "0.10"
schemars = { version = "1.0", features = ["derive", "chrono04", "rust_decimal1"] }

# Temporary pre-release validation pin; remove when es-entity #246 is released.
[patch.crates-io]
es-entity = { git = "https://github.com/GaloyMoney/es-entity", rev = "90d2ebadd00c0222b677fc3412f2857a9fa736a2" }
es-entity-macros = { git = "https://github.com/GaloyMoney/es-entity", rev = "90d2ebadd00c0222b677fc3412f2857a9fa736a2" }
errlanes = { git = "https://github.com/GaloyMoney/es-entity", rev = "90d2ebadd00c0222b677fc3412f2857a9fa736a2" }
errlanes-derive = { git = "https://github.com/GaloyMoney/es-entity", rev = "90d2ebadd00c0222b677fc3412f2857a9fa736a2" }
