[package]
name = "job-fuzz"
version = "0.13.11-dev"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
# Path to the crate under test.
job = { path = ".." }
# The hydration machinery (`EntityEvents`, `GenericEvent`, …) lives in
# es-entity; pin the same version `job` depends on so the impls unify.
es-entity = "0.12.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["clock"], default-features = false }
uuid = { version = "1.0", features = ["serde", "v7"] }

[[bin]]
name = "fuzz_job_hydration"
path = "fuzz_targets/fuzz_job_hydration.rs"
test = false
doc = false

# Standalone workspace so the fuzz crate is excluded from the parent workspace
# (cargo-fuzz convention).
[workspace]
